    <body>

                    <div class="socials-wrap">

                            <a href="https://youtube.com/@0_2_dev?si=YtXOmoIwo028xqcW"><img src="./images/icons/socials/youtube.png" class="socials"></a>
                            <a href="https://www.tiktok.com/@0_2_dev?_r=1&_t=ZS-9BOYmgc5TVd"><img src="./images/icons/socials/tiktok.png" class="socials"></a>
                        </div>
                    </div> 
                </div>      
            </div>
        </div>
    </div>  

<!--Per card-->
    <div class="card">
        <div class="card-heading">
            <div class ="img-box">
                <div>
                    <img class="avatar" src="./images/avatars/per.png" alt="Pixel art avater of Per Borgen smiling">
                </div>  
            </div>   
            <div class="txt-heading fira-sans-semibold">
                <h1>Per Borgen</h1>
            </div>
        </div>
        <div class="card-content ">

                    <div class="socials-wrap">
                        <div class="socials">

<!-- Nav-bar-->
    <div class="bottom">
        <button>
            <img class="icon" src="./images/icons/home.png" alt ="icon1">
        </button>
        <button>
            <img class="icon" src="./images/icons/menu-burger.png" alt ="icon3">
        </button>
     </div>

<!-- Animation script-->
<script>
  document.querySelectorAll('.avatar').forEach(img => {
    img.addEventListener('click', () => {
      img.classList.remove('is-wiggling');
      void img.offsetWidth;
      img.classList.add('is-wiggling');
    });

    img.addEventListener('animationend', () => {
      img.classList.remove('is-wiggling');
    });
  });
</script>

    </body>
</html>
