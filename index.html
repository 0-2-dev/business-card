<html lang="en">

    <body>
<main>

                    <a href="https://www.instagram.com/0_2_dev?vrfl=MW16ejhrNTJiNm13Zw=="><img src="./images/icons/socials/insta.png" class="icon" alt="Instagram logo"></a>
                    <a href="https://youtube.com/@0_2_dev?si=YtXOmoIwo028xqcW"><img src="./images/icons/socials/youtube.png" class="icon" alt="Youtube logo"></a>

            </div>       
        </div>

<!--Per card-->
    <article class="card">
        <header class="card-heading">
                    <img class="avatar" src="./images/avatars/per.png" alt="Pixel art avatar of Per Borgen smiling"> 
            <div class="txt-heading fira-sans-semibold">

                    <a href="https://www.instagram.com/perborgen/"><img src="./images/icons/socials/insta.png" class="icon" alt="Instagram logo"></a>
                    <a href="https://www.youtube.com/channel/UCNW7HDseZb6N3nKUEP6uLag"><img src="./images/icons/socials/youtube.png" class="icon" alt="Youtube logo"></a>

        </div>
    </article>  
</main>
<!-- Nav-bar-->
<nav class="bottom">
    <button>
         <img class="icon" src="./images/icons/home.png" alt ="Home">
    </button>
    <button>
        <img class="icon" src="./images/icons/menu-burger.png" alt ="Menu">
    </button>
</nav>

<!-- Animation script-->
<script>
  document.querySelectorAll('.avatar').forEach(img => {
    img.addEventListener('click', () => {
      img.classList.remove('is-wiggling');
      void img.offsetWidth;
      img.classList.add('is-wiggling');
    });

    img.addEventListener('animationend', () => {
      img.classList.remove('is-wiggling');
    });
  });
</script>

    </body>
</html>
